<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Prekių rūšiuotojas</title>
<meta name="theme-color" content="#1e293b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;color:#f2f5f8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
body{background:#1e293b;transition:background .6s}
body.w0{background:linear-gradient(180deg,#f6e7c9,#e6cb9c)}
body.w1{background:radial-gradient(ellipse at 50% 110%,#7c2d12 0,#3b1d12 45%,#1c1310 100%)}
body.w2{background:linear-gradient(180deg,#fde7ef,#f9c9da)}
body.w3{background:linear-gradient(180deg,#d6ecff,#a9d4fb)}
body.w0::before,body.w2::before,body.w3::before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.35}
body.w0::before{background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(150,105,55,.18) 46px 48px)}
body.w2::before{background:radial-gradient(circle,rgba(255,255,255,.7) 2px,transparent 3px) 0 0/28px 28px}
body.w3::before{background:radial-gradient(circle,rgba(255,255,255,.55) 3px,transparent 4px) 0 0/36px 36px,radial-gradient(circle,rgba(250,204,21,.35) 2px,transparent 3px) 18px 18px/36px 36px}
#app{max-width:480px;margin:0 auto;height:100dvh;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);display:flex;flex-direction:column;position:relative;z-index:1}
header{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 10px;background:rgba(14,19,26,.88);backdrop-filter:blur(4px);position:relative;z-index:5}
button{font:inherit;color:inherit;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:6px 10px;cursor:pointer}
button:disabled{opacity:.3}
button.primary{background:#3b82f6;border-color:#3b82f6;font-weight:700;padding:11px 18px}
#lvlBtn{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1;padding:4px 8px}
#lvlBtn b{font-size:16px}#lvlBtn small{font-size:11px;color:#a9b6c3}
.stats{display:flex;gap:10px;font-size:15px;color:#a9b6c3;font-variant-numeric:tabular-nums;align-items:center}
.stats b{color:#fff}.stats .warn b{color:#f87171;animation:pulse .5s infinite alternate}.stats .frz b{color:#7dd3fc}
.hbtn{display:flex;gap:6px}.hbtn button{width:42px;height:40px;padding:0;font-size:20px;position:relative}
#hint.new{animation:hintp 1s infinite alternate;border-color:#facc15}@keyframes hintp{to{box-shadow:0 0 0 4px rgba(250,204,21,.35)}}
#strip{display:flex;align-items:center;gap:8px;padding:6px 10px;background:rgba(14,19,26,.62);font-size:12px;font-weight:700;position:relative;z-index:4}
#strip .pg{flex:1;min-width:60px}#strip .pbar{height:8px;background:rgba(255,255,255,.15);border-radius:5px;overflow:hidden}#strip .pbar i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#a3e635);transition:width .35s;width:0}
#strip .ch{display:flex;flex-direction:column;gap:1px;max-width:62%}#strip .ok{color:#86efac}#strip .bad{color:#fca5a5;text-decoration:line-through}#strip .par{font-weight:600;color:#cbd5e1}#strip .par .bad{text-decoration:none}
#strip .coin{color:#fde68a;white-space:nowrap}
#board{flex:1;position:relative;display:flex;flex-direction:column;padding:6px;--sz:56px;overflow:hidden;min-height:0}
#top{flex:1;display:flex;gap:8px;min-height:0}
#grid{flex:1;display:grid;justify-content:center;align-content:center}
#conv{display:none;position:relative;overflow:hidden;margin-top:8px;border-radius:12px;background:repeating-linear-gradient(90deg,#334155 0 14px,#475569 14px 28px);box-shadow:inset 0 3px 6px rgba(0,0,0,.45),0 0 0 3px #1e293b}
#elev{display:none;position:relative;overflow:hidden;border-radius:12px;background:linear-gradient(90deg,#64748b 0 4px,transparent 4px calc(100% - 4px),#64748b calc(100% - 4px)),repeating-linear-gradient(180deg,rgba(51,65,85,.55) 0 3px,rgba(148,163,184,.25) 3px 26px);box-shadow:inset 0 0 8px rgba(0,0,0,.4),0 0 0 3px rgba(30,41,59,.6)}
#conv .shelf,#elev .shelf{position:absolute;left:0;top:0;will-change:transform;transition:none}
#conv::before,#elev::before{content:attr(data-l);position:absolute;font-size:10px;font-weight:900;letter-spacing:2px;color:rgba(255,255,255,.35);left:8px;top:2px}
#bar{display:flex;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(14,19,26,.88);position:relative;z-index:5}
#bar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 4px;border-radius:12px}
#bar b{font-size:21px;line-height:1.1}#bar small{font-size:10px;color:#fde68a;font-weight:700}#bar span{font-size:9px;color:#a9b6c3;white-space:nowrap}
/* lentynos */
.shelf{position:relative;justify-self:center;width:calc(var(--cap)*var(--sz) + 12px);padding:0 6px;transition:transform .2s}
.shelf .bk{display:flex;height:calc(var(--sz)*.46);align-items:flex-end;position:relative;z-index:0}
.shelf .bk i{width:var(--sz);text-align:center;font-style:normal;font-size:calc(var(--sz)*.56);line-height:1;opacity:.55;filter:brightness(.62) saturate(.55);transform:translateY(calc(var(--sz)*.2))}
.shelf.dark .bk i{filter:brightness(0);opacity:.28}
.shelf .bk i.q{filter:none;opacity:.5;font-size:calc(var(--sz)*.4)}
.shelf .row{display:flex;position:relative;z-index:1;height:var(--sz)}
.slot{width:var(--sz);height:var(--sz);display:flex;align-items:flex-end;justify-content:center;position:relative}
.it{width:calc(var(--sz)*.94);height:calc(var(--sz)*.94);display:flex;align-items:center;justify-content:center;font-size:calc(var(--sz)*.72);line-height:1;cursor:grab;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35));position:relative;touch-action:none;transition:transform .12s}
.it.sel{transform:translateY(-9px) scale(1.12);filter:drop-shadow(0 0 6px #fde047) drop-shadow(0 6px 4px rgba(0,0,0,.35))}
.it.lift{opacity:.15}
.it.hs{animation:hs .6s infinite alternate}@keyframes hs{to{transform:translateY(-8px) scale(1.15);filter:drop-shadow(0 0 8px #22d3ee)}}
.shelf.ht .row{animation:ht .6s infinite alternate;border-radius:10px}@keyframes ht{to{box-shadow:0 0 0 3px #22d3ee,0 0 16px #22d3ee}}
.it.hid{font-size:calc(var(--sz)*.5);font-weight:900;color:#5b3a1a;background:linear-gradient(#e9c999,#c99a62);border-radius:10px 10px 6px 6px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15),0 2px 3px rgba(0,0,0,.3);width:calc(var(--sz)*.78);height:calc(var(--sz)*.86);filter:none}
.it.hid sub{position:absolute;top:-4px;right:-4px;font-size:calc(var(--sz)*.28)}
.it.frz{cursor:not-allowed}
.it.frz::after{content:'';position:absolute;inset:4%;border-radius:12px;background:linear-gradient(135deg,rgba(224,242,254,.75),rgba(125,211,252,.45) 60%,rgba(240,249,255,.7));box-shadow:inset 0 0 0 2px rgba(255,255,255,.9)}
.w1 .it.frz::after{background:radial-gradient(circle at 50% 80%,rgba(251,146,60,.6),rgba(239,68,68,.25) 60%,transparent 75%);box-shadow:none;animation:flick .5s infinite alternate}@keyframes flick{to{opacity:.6}}
.w3 .it.frz::after{background:linear-gradient(90deg,transparent 42%,rgba(236,72,153,.85) 42% 58%,transparent 58%),linear-gradient(transparent 42%,rgba(236,72,153,.85) 42% 58%,transparent 58%),rgba(252,231,243,.55);box-shadow:inset 0 0 0 2px #ec4899}
.it.frz em{position:absolute;right:-2px;bottom:-2px;z-index:2;font-style:normal;font-size:11px;font-weight:900;background:#0c4a6e;color:#fff;border-radius:9px;padding:1px 5px;box-shadow:0 0 0 2px #fff;filter:none}
.w1 .it.frz em{background:#9a3412}.w3 .it.frz em{background:#9d174d}
.it.adv{animation:adv .38s ease-out}@keyframes adv{from{transform:translateY(-34%) scale(.6);opacity:.35;filter:brightness(.6)}}
.it.drop{animation:drop .3s ease-out}@keyframes drop{0%{transform:scale(1.25)}60%{transform:scale(.92)}100%{transform:scale(1)}}
.it.thaw{animation:thaw .6s}@keyframes thaw{0%{transform:scale(1.3);filter:drop-shadow(0 0 12px #fff)}100%{transform:scale(1)}}
.it.rev{animation:rev .5s}@keyframes rev{0%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
.shelf .plank{height:11px;border-radius:3px;margin:0 -6px;position:relative;z-index:2}
.w0 .plank{background:linear-gradient(#c08a52,#8a5a2b);box-shadow:0 4px 5px rgba(0,0,0,.25)}
.w0 .shelf .row{background:linear-gradient(rgba(120,80,40,.12),rgba(120,80,40,.22));border-radius:6px 6px 0 0}
.w1 .plank{height:6px;background:linear-gradient(#e7c08f,#a06a35);margin:0 -14px 0 -6px;border-radius:3px 10px 10px 3px;transform:translateY(calc(var(--sz)*-.48));box-shadow:0 2px 3px rgba(0,0,0,.4);clip-path:polygon(0 0,94% 0,100% 50%,94% 100%,0 100%)}
.w1 .shelf::before{content:'';position:absolute;left:0;right:0;top:calc(var(--sz)*.46 - 2px);height:calc(var(--sz) + 6px);background:repeating-linear-gradient(90deg,rgba(0,0,0,.5) 0 3px,transparent 3px 14px),linear-gradient(rgba(250,120,40,.22),rgba(60,30,20,.6));border-radius:8px;box-shadow:inset 0 -6px 12px rgba(251,146,60,.3),0 0 0 2px rgba(0,0,0,.35)}
.w1 .shelf .plank{z-index:0}
.w2 .plank{background:linear-gradient(#fff,#f9a8d4);box-shadow:0 4px 6px rgba(190,24,93,.25)}
.w2 .shelf .row{background:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.25));border:2px solid rgba(255,255,255,.8);border-bottom:0;border-radius:12px 12px 0 0}
.w3 .plank{background:linear-gradient(#60a5fa,#2563eb);box-shadow:0 4px 5px rgba(30,64,175,.3)}
.w3 .shelf:nth-child(3n+2) .plank{background:linear-gradient(#fbbf24,#d97706)}.w3 .shelf:nth-child(3n) .plank{background:linear-gradient(#f472b6,#db2777)}
.w3 .shelf .row{background:rgba(255,255,255,.28);border-radius:8px 8px 0 0}
.shelf.small .plank{filter:hue-rotate(160deg) saturate(.7)}
.shelf .ly{position:absolute;right:-2px;top:2px;z-index:3;background:#0f172a;color:#fde68a;font-size:11px;font-weight:900;border-radius:9px;padding:1px 6px;box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.shelf.bonus .plank{background:linear-gradient(#4ade80,#16a34a)}
.lockov{position:absolute;left:0;right:0;top:calc(var(--sz)*.3);bottom:0;z-index:4;border-radius:10px;background:repeating-linear-gradient(45deg,rgba(15,23,42,.62) 0 10px,rgba(30,41,59,.72) 10px 20px);display:flex;align-items:center;justify-content:center;gap:4px;font-weight:900;font-size:16px;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.lockov b{background:#facc15;color:#111;border-radius:10px;padding:0 7px;font-size:14px}
.lockov.gone{animation:lkgone .6s forwards}@keyframes lkgone{to{opacity:0;transform:scale(1.2)}}
.shelf.nope{animation:shake .3s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.it.nope{animation:shake .3s}
@keyframes pulse{to{opacity:.55}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.fly{position:absolute;left:0;top:0;display:flex;align-items:center;justify-content:center;line-height:1;filter:drop-shadow(0 8px 6px rgba(0,0,0,.35));will-change:transform}
.pop{position:absolute;left:0;top:0;display:flex;align-items:center;justify-content:center;line-height:1}
.spk{position:absolute;left:0;top:0;width:8px;height:8px;border-radius:50%}
.cmb{position:absolute;left:0;top:0;font:900 22px system-ui;color:#fde047;text-shadow:0 2px 0 #92400e,0 0 8px rgba(0,0,0,.4);white-space:nowrap;transform:translate(-50%,-50%)}
/* langai */
#overlay{position:fixed;inset:0;background:rgba(10,14,20,.72);display:none;align-items:center;justify-content:center;z-index:30}
#overlay.show{display:flex}
.card{background:#1f2a36;border-radius:18px;padding:22px;width:min(330px,88vw);max-height:92vh;overflow:auto;text-align:center;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font-size:22px}.card p{margin:0;color:#a9b6c3}.card .coin{color:#fde68a;font-weight:800}
.stars{font-size:36px;letter-spacing:4px;color:#fbbf24}.stars span{color:#4b5563}
.sbrk{display:flex;flex-direction:column;gap:4px;font-size:14px;color:#6b7280}.sbrk .on{color:#fbbf24}
.pm{display:flex;flex-direction:column;gap:8px}.pm2{display:flex;gap:8px}.pm2 button{flex:1}
.hl{display:flex;flex-direction:column;gap:10px;text-align:left;max-height:60vh;overflow:auto}.hl div{display:flex;gap:10px;align-items:flex-start}.hl b{font-size:22px;line-height:1;flex:none;width:28px;text-align:center}.hl p{margin:0;color:#cbd5e1;font-size:14px}.hl p strong{color:#fff;display:block}
.hl div .bb{margin-left:auto;flex:none;align-self:center}
.danger{background:#7f1d1d!important;border-color:#ef4444!important;color:#fff}
button.cont{background:#16a34a;border-color:#16a34a;font-weight:700}
#menu{position:fixed;inset:0;z-index:28;background:#121a23;display:none;flex-direction:column;max-width:480px;margin:0 auto;touch-action:pan-y}
#menu.show{display:flex}
.mtop{display:flex;align-items:center;gap:10px;padding:12px 12px 4px;font-size:18px}.mtop span{color:#fbbf24;font-size:15px;margin-left:auto}
.mhead{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;flex:none}
.tab{flex:none;white-space:nowrap}.tab.on{background:#3b82f6;border-color:#3b82f6}
.mbody{flex:1;overflow-y:auto;padding:0 12px 14px}
.chap{display:flex;justify-content:space-between;margin:14px 0 8px;color:#a9b6c3;font-size:13px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lv{height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;border-radius:12px}
.lv b{font-size:18px}.lv i{font-style:normal;font-size:11px;color:#fbbf24;letter-spacing:1px}.lv i span{color:#4b5563}
.lv.k-boss{background:rgba(249,115,22,.16);border-color:rgba(249,115,22,.55)}
.lv.k-big{background:rgba(168,85,247,.22);border-color:rgba(168,85,247,.7)}
.lv.k-mega{background:linear-gradient(135deg,#7c3aed,#db2777);border-color:#f0abfc}
.lv.cur{outline:3px solid #3b82f6;outline-offset:1px}
.lv.lock{opacity:.4}.lv.lock i{color:#cbd5e1}.lv.nope{animation:shake .3s}
#toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.9);background:rgba(14,19,26,.9);padding:14px 22px;border-radius:16px;font-size:22px;font-weight:800;opacity:0;transition:all .35s;z-index:29;pointer-events:none;text-align:center}
#toast small{display:block;font-size:13px;font-weight:500;color:#a9b6c3;margin-top:2px}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#home{position:fixed;inset:0;z-index:29;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#3b2f52,#120e1a 75%)}#home.show{display:flex}
.hm{width:min(320px,86vw);display:flex;flex-direction:column;gap:10px;text-align:center}.hm h1{margin:0;font:900 40px/1.05 system-ui;color:#fbbf24;text-shadow:0 3px 0 #7c2d12}
.hlogo{margin:0 auto;display:flex;flex-direction:column;align-items:center}.hlogo div{font-size:44px;display:flex;gap:4px;filter:drop-shadow(0 4px 3px rgba(0,0,0,.4))}.hlogo i{display:block;width:170px;height:12px;border-radius:4px;background:linear-gradient(#c08a52,#8a5a2b)}
.hst{margin:0 0 6px;color:#a9b6c3;font-weight:700}.hm button{padding:14px;font-size:17px}.hm button.big{font-size:22px;padding:18px}
.achb{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));z-index:80;display:flex;gap:10px;align-items:center;background:#1f2a36;border:2px solid #fbbf24;border-radius:14px;padding:8px 14px;box-shadow:0 8px 24px rgba(0,0,0,.4);min-width:260px}.achb b{font-size:30px}.achb small{display:block;color:#fbbf24;font-weight:800;font-size:11px}.achb strong{display:block;font-size:16px}.achb span{font-size:12px;color:#a9b6c3}
.achl{display:flex;flex-direction:column;gap:6px;max-height:58vh;overflow:auto;text-align:left}.acha{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.05);border-radius:10px;padding:7px 9px;opacity:.75}.acha.got{opacity:1;background:rgba(251,191,36,.12)}.acha b{font-size:24px}.acha div{flex:1}.acha strong{display:block;font-size:14px}.acha span{font-size:12px;color:#a9b6c3}.acha i{display:block;height:5px;background:rgba(255,255,255,.12);border-radius:3px;margin-top:4px;overflow:hidden}.acha u{display:block;height:100%;background:#fbbf24}.acha small{font-size:10px;color:#a9b6c3}.acha em{font-style:normal;font-size:12px;font-weight:800;color:#fde68a}
#upd{position:fixed;left:8px;right:8px;top:calc(58px + env(safe-area-inset-top));z-index:60;max-width:464px;margin:0 auto;display:none;align-items:center;gap:10px;background:#0f766e;color:#fff;border-radius:14px;padding:10px 12px;font:600 14px system-ui;box-shadow:0 6px 20px rgba(0,0,0,.35)}#upd.show{display:flex}#upd b{flex:1}#upd button{border:0;border-radius:10px;padding:9px 12px;font:700 14px system-ui;background:#fff;color:#0f766e}#upd .x{background:transparent;color:#fff;padding:9px 6px}.ver{opacity:.6;font-size:12px;text-align:center;margin-top:10px}

/* ===== gyvesnė grafika ===== */
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
#bg .blob{position:absolute;border-radius:50%;filter:blur(46px);opacity:.5;animation:blob 16s ease-in-out infinite alternate}
@keyframes blob{50%{transform:translate(30px,-50px) scale(1.2)}100%{transform:translate(-40px,30px) scale(.9)}}
#bg .fl{position:absolute;bottom:-70px;opacity:.17;animation:floatUp linear infinite;filter:saturate(1.2)}
@keyframes floatUp{to{transform:translateY(-120vh) rotate(380deg)}}
body.w1 #bg .fl{opacity:.12}
header{background:linear-gradient(135deg,rgba(49,46,129,.94),rgba(15,23,42,.94));box-shadow:0 4px 16px rgba(0,0,0,.28);border-bottom:1px solid rgba(255,255,255,.08)}
#lvlBtn{background:linear-gradient(#4f46e5,#3730a3);border-color:rgba(255,255,255,.25);box-shadow:0 3px 0 #1e1b4b}
#lvlBtn small{color:#c7d2fe}
.stats span{background:rgba(0,0,0,.28);border-radius:20px;padding:3px 10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.hbtn button{background:linear-gradient(#475569,#1e293b);box-shadow:0 3px 0 #0b1220;border-color:rgba(255,255,255,.15)}
#strip{background:linear-gradient(90deg,rgba(15,23,42,.72),rgba(30,27,75,.62))}
#strip .pbar{height:10px;box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
#strip .pbar i{background:linear-gradient(90deg,#22c55e,#bef264,#22c55e);background-size:200% 100%;animation:shine 1.6s linear infinite;box-shadow:0 0 8px rgba(163,230,53,.6)}
@keyframes shine{to{background-position:-200% 0}}
#bar{background:linear-gradient(0deg,rgba(15,23,42,.96),rgba(49,46,129,.9));border-top:1px solid rgba(255,255,255,.08)}
#bar button{background:linear-gradient(#475569,#273449);border:1px solid rgba(255,255,255,.14);box-shadow:0 3px 0 #0b1220,inset 0 1px 0 rgba(255,255,255,.18);transition:transform .08s}
#bar button:not(:disabled):active,.hbtn button:active,#lvlBtn:active{transform:translateY(2px);box-shadow:0 1px 0 #0b1220}
#bar button:not(:disabled) b{animation:bob 2.6s ease-in-out infinite}
#bar button:nth-child(2) b{animation-delay:.3s}#bar button:nth-child(3) b{animation-delay:.6s}#bar button:nth-child(4) b{animation-delay:.9s}#bar button:nth-child(5) b{animation-delay:1.2s}#bar button:nth-child(6) b{animation-delay:1.5s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
button.primary{background:linear-gradient(#60a5fa,#2563eb);border-color:#93c5fd;box-shadow:0 4px 0 #1e3a8a,0 6px 14px rgba(37,99,235,.35)}
button.cont{background:linear-gradient(#4ade80,#16a34a);box-shadow:0 4px 0 #14532d}
.card{background:linear-gradient(160deg,#2a3650,#1b2435);border:1px solid rgba(255,255,255,.1);box-shadow:0 18px 50px rgba(0,0,0,.5);animation:cardIn .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes cardIn{from{transform:scale(.8) translateY(20px);opacity:0}}
.stars{text-shadow:0 0 14px rgba(251,191,36,.7)}
/* lentynų gylis */
.shelf .row{box-shadow:inset 0 10px 14px -8px rgba(0,0,0,.35)}
.shelf .plank::after{content:'';position:absolute;left:4px;right:4px;top:1px;height:2px;border-radius:2px;background:rgba(255,255,255,.45)}
.shelf .plank::before{content:'';position:absolute;left:8%;right:8%;top:100%;height:10px;background:radial-gradient(ellipse at 50% 0,rgba(0,0,0,.28),transparent 70%)}
.w0 .shelf .row{background:linear-gradient(#b08250 0,#d9b98c 22%,#cfa978)}
.w2 .shelf .row{background:linear-gradient(rgba(255,255,255,.65),rgba(255,228,240,.5))}
.w3 .shelf .row{background:linear-gradient(rgba(255,255,255,.55),rgba(219,234,254,.45))}
/* prekių gyvumas */
.it.in{animation:itIn .55s cubic-bezier(.3,1.6,.5,1) backwards}
@keyframes itIn{from{transform:translateY(-70px) scale(.3);opacity:0}}
.it.wig{animation:wig .7s ease-in-out}
@keyframes wig{20%{transform:rotate(-12deg) scale(1.08)}40%{transform:rotate(10deg) scale(1.08)}60%{transform:rotate(-6deg)}80%{transform:rotate(3deg)}}
#board.shk{animation:bshk .4s}
@keyframes bshk{20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,0)}}
body.hurry #board{box-shadow:inset 0 0 50px rgba(239,68,68,.45);animation:hurry 1s infinite alternate}
@keyframes hurry{to{box-shadow:inset 0 0 20px rgba(239,68,68,.25)}}
.ring{position:absolute;left:0;top:0;border-radius:50%;border:4px solid #fde047;box-shadow:0 0 14px #fde047}
.str{position:absolute;left:0;top:0;font-size:16px;line-height:1}
#conf{position:fixed;inset:0;z-index:31;pointer-events:none}
.hlogo div span{display:inline-block;animation:hop 1.4s ease-in-out infinite}
.hlogo div span:nth-child(2){animation-delay:.18s}.hlogo div span:nth-child(3){animation-delay:.36s}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px) rotate(-8deg)}60%{transform:translateY(0) scale(1.1,.9)}}
.hm h1{background:linear-gradient(#fde68a,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 3px 0 #7c2d12)}
#home{background:radial-gradient(circle at 30% 20%,#6d28d9 0,transparent 45%),radial-gradient(circle at 80% 80%,#db2777 0,transparent 45%),#160f24}
#lvlBtn b,#lvlBtn small,.stats span{white-space:nowrap}.stats{gap:6px;font-size:14px}

const WORLDS=[

  sk:{lock:['🔒','Užrakinta lentyna'],frozen:['🧊','Šaldytos prekės'],hidden:['🛍️','Prekės maišeliuose'],dark:['🌑','Tamsus sandėlis'],small:['📏','Siauros lentynos'],conv:['🛻','Konvejeris'],elev:['🛗','Kylančios lentynos']}},

  sk:{lock:['⛓️','Uždengti iešmai'],frozen:['🔥','Dar kepa'],hidden:['🌿','Po prieskoniais'],dark:['💨','Dūmai'],small:['🥢','Trumpi iešmai'],conv:['🛻','Besisukantis grilis'],elev:['🛗','Kylantys iešmai']}},

  sk:{lock:['🔒','Užrakintos vitrinos'],frozen:['❄️','Šaldyti desertai'],hidden:['📦','Dėžutės'],dark:['🌫️','Miltų debesys'],small:['📏','Siauros lentynėlės'],conv:['🛻','Konvejeris'],elev:['🛗','Kylančios vitrinos']}},

const MECH_ORDER=['lock','conv','frozen','elev','hidden','dark','small'],MECH_Q=[6,16,26,36,46,56,66];

function mechsOf(L){

  const W=worldOf(L),r2=rng(L*31337+3),own=shuffle(W.items.slice(),r2);
  const rest=shuffle(ALL_GOODS.filter(x=>!W.items.includes(x)),r2);

  const items=[...new Set([...own.slice(0,K-mixN),...rest.slice(0,mixN),...own,...rest])].slice(0,K);

  S=Math.max(S,conv+elev+(conv&&elev?3:2));

  if(L===1)S=4;
  const free=L<=3?3:Math.max(3,Math.round(S*(.75-D*.35)));
  const small=on.has('small')?1+Math.round(f):0;
  const lockN=on.has('lock')?Math.min(2,1+(q>=30?1:0)):0,lockAt=[];for(let i=0;i<lockN;i++)lockAt.push(Math.max(2,Math.min(K-2,3+i*2+Math.floor(pr()*2)+(boss?1:0))));

    convSpd:(16+D*18)*(pr()<.5?1:-1),elevSpd:12+D*14};

/* --- lygio kūrimas atbuline eiga: nuo tuščių lentynų „atžaidžiam“ sprendimą atgal,

function buildRev(p,r){

function generate(L){

/* --- sprendėjas: DFS su euristika ir aplankytų būsenų atmintimi --- */

        $('cy').onclick=()=>{DAILY.on=false;newGame(L)};$('cn').onclick=closeCard}else{DAILY.on=false;newGame(L)}}else{b.classList.remove('nope');void b.offsetWidth;b.classList.add('nope');sfx('locked');
        toast('🔒 Lygis dar užrakintas','Pirmiausia įveik ankstesnius lygius')}});
}
/* ===================== DIENOS IŠŠŪKIS ===================== */
var DAILY={on:false,L:0};
const dayNo=()=>{const d=new Date();return Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()))/864e5)};
function dailyLevel(day=dayNo()){const h=Math.abs(Math.imul(day^0x5bd1e995,0x27d4eb2d)>>>0);return (1+h%4)*STAGE+6+(h>>>4)%13}
function dailyState(){return store.get('prekes.daily',{})}
function dailyDone(){return dailyState().d===dayNo()}
function startDaily(){hideHome();DAILY.on=true;DAILY.L=dailyLevel();newGame(DAILY.L,false,'daily');toast('📅 Dienos iššūkis',dailyDone()?'Šiandien jau įveikta – žaidi dėl smagumo':'Įveik ir gauk 🪙')}
function dailyWin(g0){const g=game,st=g.stars(),s=dailyState(),day=dayNo(),first=s.d!==day;let coin=0,streak=s.streak||0;
  if(first&&tmOn()){}else if(first){streak=s.d===day-1?streak+1:1;coin=addCoins(25+st*5+Math.min(50,(streak-1)*5));store.set('prekes.daily',{d:day,st,streak,best:Math.max(streak,s.best||0)});achAdd('daily',1);achSet('streak',streak)}
  else if(!tmOn()&&st>(s.st||0)){s.st=st;store.set('prekes.daily',s)}
  sfx('win');confetti();showCard(`<h2>📅 Dienos iššūkis įveiktas!</h2><div class="stars">${'★'.repeat(st)}<span>${'★'.repeat(4-st)}</span></div>
    <p>${fmt(g.el)} · ${g.moves} ėj.</p>${tmOn()?'<p class="coin">🧪 Testo režimas – apdovanojimų nėra</p>':first?`<p class="coin">🪙 +${coin} · serija ${streak} d.${streak>1?' 🔥':''}</p>`:'<p>Šiandien apdovanojimas jau gautas</p>'}<p>Kitas iššūkis – rytoj</p>
    <button class="primary" id="dh">🏠 Pagrindinis meniu</button><button id="dl">▶ Žaisti lygius</button>`);
  $('dh').onclick=()=>{DAILY.on=false;closeCard();newGame(store.get('prekes.level',1));showHome()};$('dl').onclick=()=>{DAILY.on=false;newGame(store.get('prekes.level',1))}}
/* ===================== PASIEKIMAI ===================== */
const ACH=[
 {id:'first',ic:'🛒',n:'Pirmasis pirkinys',d:'Įveik pirmą lygį',k:'lv',t:1,r:10},
 {id:'lv10',ic:'🧾',n:'Kasininkas',d:'Įveik 10 skirtingų lygių',k:'lv',t:10,r:20},
 {id:'lv50',ic:'🏷️',n:'Parduotuvės vedėjas',d:'Įveik 50 skirtingų lygių',k:'lv',t:50,r:50},
 {id:'lv100',ic:'🏬',n:'Prekybos tinklo savininkas',d:'Įveik 100 skirtingų lygių',k:'lv',t:100,r:100},
 {id:'s4',ic:'⭐',n:'Tobula!',d:'Surink 4 ★ viename lygyje',k:'s4',t:1,r:15},
 {id:'s4x20',ic:'🌟',n:'Perfekcionistas',d:'Surink 4 ★ 20-yje lygių',k:'s4',t:20,r:60},
 {id:'st100',ic:'✨',n:'Žvaigždžių rinkėjas',d:'Surink iš viso 100 ★',k:'stars',t:100,r:40},
 {id:'m100',ic:'📦',n:'Rūšiuotojas',d:'Išvalyk 100 trejetų',k:'match',t:100,r:20},
 {id:'m1000',ic:'🏭',n:'Sandėlio karalius',d:'Išvalyk 1000 trejetų',k:'match',t:1000,r:80},
 {id:'combo3',ic:'🔗',n:'Kombo!',d:'Padaryk kombo ×3',k:'combo',t:3,r:10},
 {id:'combo6',ic:'⛓️',n:'Kombo meistras',d:'Padaryk kombo ×6',k:'combo',t:6,r:40},
 {id:'fast',ic:'⚡',n:'Žaibas',d:'Įveik lygį per pusę laiko normos',k:'fast',t:1,r:20},
 {id:'nohelp10',ic:'💪',n:'Be pagalbos',d:'Įveik 10 lygių nenaudodamas pagalbų',k:'nohelp',t:10,r:30},
 {id:'boss1',ic:'🔥',n:'Bosų medžiotojas',d:'Įveik bosą',k:'boss',t:1,r:20},
 {id:'boss10',ic:'👑',n:'Bosų griovėjas',d:'Įveik 10 skirtingų bosų',k:'boss',t:10,r:60},
 {id:'world',ic:'🏁',n:'Etapas įveiktas',d:'Įveik etapo bosą (20 lygį)',k:'world',t:1,r:50},
 {id:'world5',ic:'🌍',n:'Ilgų distancijų pirkėjas',d:'Įveik 5 etapų bosus',k:'world',t:5,r:150},
 {id:'daily1',ic:'📅',n:'Kasdienis',d:'Įveik dienos iššūkį',k:'daily',t:1,r:15},
 {id:'daily30',ic:'🗓️',n:'Ištikimas pirkėjas',d:'Įveik 30 dienos iššūkių',k:'daily',t:30,r:100},
 {id:'streak7',ic:'🔥',n:'Savaitė be pertraukos',d:'7 dienų dienos iššūkių serija',k:'streak',t:7,r:70},
 {id:'help',ic:'🧰',n:'Pagalbos ranka',d:'Panaudok pagalbą',k:'boost',t:1,r:5},
];
function achStats(){const s=store.get('prekes.ach',{c:{},got:{}});s.c=s.c||{};s.got=s.got||{};return s}
function achVal(k,s){let v=0;
  if(k==='lv')return Object.keys(best).filter(l=>best[l]>0).length;
  if(k==='s4')return Object.keys(best).filter(l=>best[l]>=4).length;
  if(k==='stars'){for(const l in best)v+=best[l]||0;return v}
  if(k==='boss')return Object.keys(best).filter(l=>best[l]>0&&kindOf(+l)!=='n').length;
  if(k==='world')return Object.keys(best).filter(l=>best[l]>0&&qOf(+l)===STAGE).length;
  return s.c[k]||0}
function achAdd(k,n){if(tmOn())return;const s=achStats();s.c[k]=(s.c[k]||0)+n;store.set('prekes.ach',s);achCheck()}
function achSet(k,v){if(tmOn())return;const s=achStats();s.c[k]=Math.max(s.c[k]||0,v);store.set('prekes.ach',s);achCheck()}
function achCheck(){const s=achStats(),fresh=[];ACH.forEach(a=>{if(!s.got[a.id]&&achVal(a.k,s)>=a.t){s.got[a.id]=Date.now();fresh.push(a)}});
  if(!fresh.length)return;store.set('prekes.ach',s);
  fresh.forEach((a,i)=>setTimeout(()=>{addCoins(a.r);sfx('unlock');achBanner(a);renderHUD()},600+i*2600))}
function achBanner(a){const e=document.createElement('div');e.className='achb';e.innerHTML=`<b>${a.ic}</b><div><small>🏆 Pasiekimas</small><strong>${a.n}</strong><span>${a.d} · 🪙 +${a.r}</span></div>`;document.body.appendChild(e);
  e.animate([{transform:'translate(-50%,-140%)'},{transform:'translate(-50%,0)',offset:.12},{transform:'translate(-50%,0)',offset:.88},{transform:'translate(-50%,-140%)'}],{duration:2500,easing:'ease-in-out'}).onfinish=()=>e.remove()}
function openAch(back){const s=achStats(),n=ACH.filter(a=>s.got[a.id]).length;
  showCard(`<h2>🏆 Pasiekimai</h2><p>${n} / ${ACH.length}</p><div class="achl">${ACH.map(a=>{const got=s.got[a.id],v=Math.min(a.t,achVal(a.k,s));
    return `<div class="acha${got?' got':''}"><b>${a.ic}</b><div><strong>${a.n}</strong><span>${a.d}</span>${got?'':`<i><u style="width:${v/a.t*100}%"></u></i><small>${v} / ${a.t}</small>`}</div><em>${got?'✅':'🪙 '+a.r}</em></div>`}).join('')}</div><button id="ab">← Atgal</button>`);
  $('ab').onclick=()=>back?back():closeCard()}
/* ===================== PAGRINDINIS MENIU ===================== */
var HOME={on:false};
function showHome(){HOME.on=true;if(game&&curWorld)setBg(curWorld);let tot=0;for(const k in best)tot+=best[k]||0;const w=worldOf(level);
  $('home').innerHTML=`<div class="hm"><div class="hlogo"><div>${[0,1,2].map(()=>`<span>${w.items[0]}</span>`).join('')}</div><i></i></div><h1>Prekių<br>rūšiuotojas</h1>
    <p class="hst">${w.emoji} Etapas ${cyc(level)+1} · Lygis ${level}<br>★ ${tot} · 🪙 ${COINS}</p>
    <button class="primary big" id="hpl">▶ ${unlocked>1?'Tęsti':'Žaisti'}</button>
    <button id="hdl">📅 Dienos iššūkis${dailyDone()?' ✅':' · 🪙'}</button><button id="hlv">🗺️ Lygiai</button><button id="hac">🏆 Pasiekimai</button><button id="hst">⚙️ Nustatymai</button>
    <div class="ver">Versija ${VERSION}</div></div>`;$('home').classList.add('show');
  $('hpl').onclick=()=>{auInit();hideHome()};$('hdl').onclick=()=>{auInit();startDaily()};$('hac').onclick=()=>openAch();$('hlv').onclick=()=>{hideHome();openMenu()};$('hst').onclick=()=>openSettings()}
function hideHome(){HOME.on=false;$('home').classList.remove('show');
  const hi=hintItems(),seen=store.get('prekes.seenHints',{});if(game&&game.moves===0&&hi.some(h=>h[0]!=='chal'&&!seen[h[0]]))setTimeout(()=>{if(!$('overlay').classList.contains('show'))showHints()},400)}
/* ===================== VERSIJA IR ATNAUJINIMAI ===================== */
var UPD={latest:null,reg:null};
const verCmp=(a,b)=>{const x=String(a).split('.').map(Number),y=String(b).split('.').map(Number);for(let i=0;i<Math.max(x.length,y.length);i++){const d=(x[i]||0)-(y[i]||0);if(d)return d}return 0};
const hosted=()=>/^https?:$/.test(location.protocol)&&/github\.io$/.test(location.hostname);
async function checkUpdate(manual){
  const say=(t,c)=>{if(!manual)return;const e=$('cus');if(e){e.innerHTML=t;e.style.color=c||''}else toast(t,'')};
  say('⏳ Tikrinama…');
  if(!hosted())return say('ℹ️ Šioje peržiūroje atnaujinimai netikrinami – tik įdiegtame žaidime.');
  if(!navigator.onLine)return say('📴 Nėra interneto ryšio. Prisijunk ir bandyk dar kartą.','#fca5a5');
  try{const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),8000);const r=await fetch('version.json?t='+Date.now(),{cache:'no-store',signal:ctl.signal});clearTimeout(tm);if(!r.ok)throw 0;const j=await r.json();UPD.latest=j.version;
    if(verCmp(j.version,VERSION)>0){$('updt').textContent='Yra nauja versija '+j.version+(j.notes?' – '+j.notes:'');$('upd').classList.add('show');
      say(`🆕 Yra nauja versija <b>${j.version}</b>${j.notes?' – '+j.notes:''}<br><button class="primary" id="cun" style="margin-top:8px;width:100%">Atnaujinti dabar</button>`,'#86efac');const b=$('cun');if(b)b.onclick=applyUpdate}
    else say(`✅ Turi naujausią versiją (${VERSION})`,'#86efac');
  }catch(e){say(navigator.onLine?'⚠️ Nepavyko pasiekti serverio. Patikrink internetą ir bandyk dar kartą.':'📴 Nėra interneto ryšio.','#fca5a5')}}
async function applyUpdate(){$('updb').textContent='Atnaujinama…';
  try{if(UPD.reg){await UPD.reg.update()}const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}catch(e){}
  location.reload()}
$('updb').onclick=applyUpdate;$('updx').onclick=()=>$('upd').classList.remove('show');
if(hosted()&&'serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').then(r=>{UPD.reg=r}).catch(()=>{})}
setTimeout(()=>checkUpdate(false),1500);addEventListener('online',()=>checkUpdate(false));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate(false)});
/* ===================== PALEIDIMAS ===================== */
HOME.on=true;newGame(level,false);showHome();setTimeout(achCheck,2500);

</script>
