<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Prekių rūšiuotojas</title>
<meta name="theme-color" content="#0e7490">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ================= PAGRINDAS ================= */
:root{--font:'Fredoka',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--ink:#1e293b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;color:#fff;font-family:var(--font);touch-action:none;user-select:none;-webkit-user-select:none}
body{background:#0e7490;transition:background .6s}
body.w0{background:radial-gradient(130% 85% at 50% 0%,#a5f3fc 0,#22d3ee 30%,#0891b2 62%,#164e63 100%)}
body.w1{background:radial-gradient(130% 85% at 50% 100%,#fdba74 0,#ea580c 30%,#9a3412 62%,#2a0f06 100%)}
body.w2{background:radial-gradient(130% 85% at 50% 0%,#fbcfe8 0,#f472b6 32%,#be185d 70%,#500724 100%)}
body.w3{background:radial-gradient(130% 85% at 50% 0%,#c7d2fe 0,#818cf8 32%,#4f46e5 66%,#1e1b4b 100%)}
button{font:inherit;color:inherit;cursor:pointer}
/* gyvas fonas: besisukantys spinduliai, mirgantys taškeliai, plaukiančios prekės */
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
#bg::before{content:'';position:absolute;left:50%;top:40%;width:240vmax;height:240vmax;margin:-120vmax 0 0 -120vmax;background:repeating-conic-gradient(rgba(255,255,255,.09) 0 8deg,transparent 8deg 16deg);animation:spin 100s linear infinite}
#bg::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,transparent 25%,rgba(0,0,0,.38) 100%)}
@keyframes spin{to{transform:rotate(360deg)}}
#bg .fl{position:absolute;bottom:-80px;opacity:.22;animation:floatUp linear infinite}
@keyframes floatUp{to{transform:translateY(-125vh) rotate(380deg)}}
#bg .tw{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 10px 2px #fff;animation:tw 3.2s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(.1);opacity:0}50%{transform:scale(1);opacity:.85}}
#app{max-width:480px;margin:0 auto;height:100dvh;padding-top:env(safe-area-inset-top);display:flex;flex-direction:column;position:relative;z-index:1}
/* ================= VIRŠUS ================= */
header{display:flex;align-items:center;gap:6px;padding:8px 8px 4px;position:relative;z-index:5}
#lvlBtn{display:flex;flex-direction:column;align-items:flex-start;line-height:1.05;padding:5px 11px 6px;border-radius:15px;background:linear-gradient(#a78bfa,#7c3aed);border:2px solid #ede9fe;box-shadow:0 4px 0 #4c1d95,0 6px 10px rgba(0,0,0,.25);white-space:nowrap}
#lvlBtn b{font-size:18px;font-weight:700;text-shadow:0 2px 0 rgba(76,29,149,.6)}#lvlBtn small{font-size:11px;font-weight:600;color:#ede9fe}
.stats{flex:1;display:flex;gap:5px;justify-content:center;font-variant-numeric:tabular-nums}
.stats span{display:flex;align-items:center;gap:4px;background:rgba(15,23,42,.5);border-radius:999px;padding:4px 10px 4px 7px;font-size:15px;font-weight:600;white-space:nowrap;box-shadow:inset 0 2px 0 rgba(255,255,255,.1),0 2px 0 rgba(0,0,0,.2)}
.stats .warn{background:#dc2626;animation:pulse .5s infinite alternate}.stats .frz{background:#0284c7}
.hbtn{display:flex;gap:6px}
.hbtn button{width:44px;height:44px;padding:0;font-size:21px;border-radius:14px;background:linear-gradient(#fde68a,#f59e0b);border:2px solid #fff7d6;box-shadow:0 4px 0 #b45309,0 6px 10px rgba(0,0,0,.25)}
#pause{background:linear-gradient(#93c5fd,#3b82f6);border-color:#dbeafe;box-shadow:0 4px 0 #1e40af,0 6px 10px rgba(0,0,0,.25)}
#hint.new{animation:glow 1s infinite alternate}@keyframes glow{to{box-shadow:0 4px 0 #b45309,0 0 0 5px rgba(253,224,71,.55)}}
#lvlBtn:active,.hbtn button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
#strip{display:flex;align-items:center;gap:8px;padding:2px 10px 6px;font-size:12px;font-weight:600;position:relative;z-index:4}
#strip .ch{display:flex;flex-direction:column;gap:2px;max-width:58%;text-shadow:0 1px 2px rgba(0,0,0,.5)}
#strip .ch div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#strip .ok{color:#bbf7d0}#strip .bad{color:#fecaca;text-decoration:line-through}#strip .par{font-weight:500;color:#e2e8f0}#strip .par .bad{text-decoration:none}
#strip .pg{flex:1;min-width:60px;position:relative;padding-right:10px}
#strip .pbar{height:14px;background:rgba(15,23,42,.5);border:2px solid rgba(255,255,255,.65);border-radius:10px;overflow:hidden;box-shadow:0 2px 0 rgba(0,0,0,.2)}
#strip .pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22c55e,#bef264,#22c55e);background-size:200% 100%;animation:shine 1.6s linear infinite;transition:width .45s cubic-bezier(.3,1.4,.5,1);border-radius:8px}
#strip .pstar{position:absolute;right:-4px;top:50%;transform:translateY(-52%);font-size:22px;filter:drop-shadow(0 2px 1px rgba(0,0,0,.35))}
#strip .pg.bump .pstar{animation:bump .35s}
@keyframes bump{50%{transform:translateY(-52%) scale(1.5) rotate(15deg)}}
@keyframes shine{to{background-position:-200% 0}}
#coinp{display:flex;align-items:center;gap:3px;background:linear-gradient(#fef3c7,#fcd34d);color:#78350f;border:2px solid #fff;border-radius:999px;padding:1px 9px 1px 5px;font-size:14px;font-weight:700;box-shadow:0 3px 0 #b45309;white-space:nowrap}
#coinp.bump{animation:cbump .3s}@keyframes cbump{50%{transform:scale(1.25)}}
/* ================= LENTA IR SPINTA ================= */
#board{flex:1;position:relative;display:flex;flex-direction:column;padding:4px 6px;--sz:56px;min-height:0}
#top{flex:1;display:flex;gap:8px;min-height:0}
#grid{flex:1;display:flex;align-items:center;justify-content:center;min-width:0}
.cab{display:grid;padding:8px;border-radius:18px;position:relative}
.w0 .cab{background:linear-gradient(#b06a2c,#7c4318);box-shadow:inset 0 3px 0 rgba(255,255,255,.28),inset 0 -4px 0 rgba(0,0,0,.25),0 9px 0 #4a260b,0 16px 28px rgba(0,0,0,.35)}
.w1 .cab{background:linear-gradient(#3f3f46,#18181b);box-shadow:inset 0 2px 0 rgba(255,255,255,.2),inset 0 0 0 2px #52525b,0 9px 0 #09090b,0 16px 28px rgba(0,0,0,.45)}
.w2 .cab{background:linear-gradient(#fff,#fbcfe8);box-shadow:inset 0 -4px 0 #f9a8d4,0 9px 0 #be185d,0 16px 28px rgba(80,7,36,.35)}
.w3 .cab{background:linear-gradient(#60a5fa,#2563eb);box-shadow:inset 0 3px 0 rgba(255,255,255,.4),inset 0 -4px 0 rgba(0,0,0,.2),0 9px 0 #1e3a8a,0 16px 28px rgba(0,0,0,.35)}
.shelf{position:relative;justify-self:center;width:calc(var(--cap)*var(--sz) + 12px);padding:0 6px;border-radius:10px 10px 4px 4px;transition:transform .2s}
.w0 .shelf{background:radial-gradient(130% 95% at 50% 0%,#fffaf0 0,#f8deb0 50%,#dcb27a 100%);box-shadow:inset 0 7px 10px -2px rgba(110,60,15,.45)}
.w1 .shelf{background:radial-gradient(130% 100% at 50% 110%,#fb923c 0,#9a3412 35%,#292524 75%);box-shadow:inset 0 6px 10px rgba(0,0,0,.55)}
.w1 .shelf::before{content:'';position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(90deg,rgba(0,0,0,.45) 0 3px,transparent 3px 14px);pointer-events:none}
.w2 .shelf{background:linear-gradient(160deg,rgba(255,255,255,.95),#fde4ef 55%,#fbcfe8);box-shadow:inset 0 6px 10px rgba(190,24,93,.22),inset 0 0 0 2px rgba(255,255,255,.9)}
.w2 .shelf::after{content:'';position:absolute;top:0;bottom:0;left:12%;width:16%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);pointer-events:none;z-index:3}
.w3 .shelf{background:radial-gradient(130% 95% at 50% 0%,#fffbeb 0,#fef3c7 45%,#fcd9a4 100%);box-shadow:inset 0 6px 10px rgba(30,58,138,.3)}
.shelf .bk{display:flex;height:calc(var(--sz)*.46);align-items:flex-end;position:relative;z-index:0}
.shelf .bk i{width:var(--sz);text-align:center;font-style:normal;font-size:calc(var(--sz)*.58);line-height:1;opacity:.6;filter:brightness(.55) saturate(.6);transform:translateY(calc(var(--sz)*.22))}
.w1 .shelf .bk i{filter:brightness(.4) saturate(.5);opacity:.75}
.shelf.dark .bk i{filter:brightness(0);opacity:.3}
.shelf .bk i.q{filter:none;opacity:.55;font-size:calc(var(--sz)*.42)}
.shelf .row{display:flex;position:relative;z-index:1;height:var(--sz)}
.slot{width:var(--sz);height:var(--sz);display:flex;align-items:flex-end;justify-content:center;position:relative}
.slot.f::after{content:'';position:absolute;bottom:0;left:16%;right:16%;height:8px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.38),transparent);z-index:-1}
.w1 .slot.f::after{display:none}
.it{width:calc(var(--sz)*.98);height:calc(var(--sz)*.98);display:flex;align-items:center;justify-content:center;font-size:calc(var(--sz)*.8);line-height:1;cursor:grab;position:relative;touch-action:none;transition:transform .12s;text-shadow:0 0 2px #fff,0 0 1px #fff,0 4px 4px rgba(0,0,0,.35)}
.w1 .it{text-shadow:0 0 2px rgba(255,237,213,.9),0 4px 5px rgba(0,0,0,.6)}
.it.sel{transform:translateY(-12px) scale(1.16);text-shadow:0 0 10px #fde047,0 0 3px #fff,0 10px 8px rgba(0,0,0,.35);z-index:3}
.it.lift{opacity:.15}
.it.hs{animation:hs .6s infinite alternate;z-index:3}@keyframes hs{to{transform:translateY(-9px) scale(1.18);text-shadow:0 0 12px #22d3ee,0 0 3px #fff}}
.shelf.ht{animation:ht .6s infinite alternate}@keyframes ht{to{box-shadow:0 0 0 4px #22d3ee,0 0 18px #22d3ee}}
.it.hid{font-size:calc(var(--sz)*.5);font-weight:700;color:#5b3a1a;text-shadow:none;background:linear-gradient(#ecd0a3,#c99a62);border-radius:12px 12px 7px 7px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.15),inset 0 2px 0 rgba(255,255,255,.4),0 3px 4px rgba(0,0,0,.3);width:calc(var(--sz)*.8);height:calc(var(--sz)*.86)}
.it.hid sub{position:absolute;top:-6px;right:-6px;font-size:calc(var(--sz)*.3)}
.it.frz{cursor:not-allowed}
.it.frz::after{content:'';position:absolute;inset:3%;border-radius:14px;background:linear-gradient(135deg,rgba(224,242,254,.8),rgba(125,211,252,.5) 60%,rgba(240,249,255,.75));box-shadow:inset 0 0 0 2px rgba(255,255,255,.95),0 0 8px rgba(125,211,252,.7)}
.w1 .it.frz::after{background:radial-gradient(circle at 50% 85%,rgba(251,146,60,.75),rgba(239,68,68,.3) 55%,transparent 75%);box-shadow:none;animation:flick .45s infinite alternate}@keyframes flick{to{opacity:.55;transform:scaleY(1.06)}}
.w3 .it.frz::after{background:linear-gradient(90deg,transparent 42%,rgba(236,72,153,.9) 42% 58%,transparent 58%),linear-gradient(transparent 42%,rgba(236,72,153,.9) 42% 58%,transparent 58%),rgba(252,231,243,.6);box-shadow:inset 0 0 0 2px #ec4899}
.it.frz em{position:absolute;right:-3px;bottom:-3px;z-index:2;font-style:normal;font-size:12px;font-weight:700;background:#0369a1;color:#fff;text-shadow:none;border-radius:10px;padding:0 6px;border:2px solid #fff}
.w1 .it.frz em{background:#c2410c}.w3 .it.frz em{background:#be185d}
.it.adv{animation:adv .42s cubic-bezier(.3,1.5,.5,1) .22s backwards}@keyframes adv{from{transform:translateY(-38%) scale(.55);opacity:.3;filter:brightness(.5)}}
.it.drop{animation:drop .32s ease-out}@keyframes drop{0%{transform:scale(1.25,.8)}45%{transform:scale(.9,1.12)}75%{transform:scale(1.04,.97)}100%{transform:scale(1)}}
.it.thaw{animation:thaw .6s}@keyframes thaw{0%{transform:scale(1.35);filter:brightness(1.8)}100%{transform:scale(1)}}
.it.rev{animation:rev .5s}@keyframes rev{0%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
.it.in{animation:itIn .55s cubic-bezier(.3,1.6,.5,1) backwards}@keyframes itIn{from{transform:translateY(-80px) scale(.3);opacity:0}}
.it.wig{animation:wig .7s ease-in-out}@keyframes wig{20%{transform:rotate(-12deg) scale(1.1)}40%{transform:rotate(10deg) scale(1.1)}60%{transform:rotate(-6deg)}80%{transform:rotate(3deg)}}
.it.nope,.shelf.nope{animation:shake .3s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shelf .plank{height:12px;margin:0 -6px;border-radius:4px;position:relative;z-index:2}
.shelf .plank::after{content:'';position:absolute;left:5px;right:5px;top:2px;height:2px;border-radius:2px;background:rgba(255,255,255,.5)}
.w0 .plank{background:linear-gradient(#d8955a,#9a5b24);box-shadow:0 3px 0 #5e3410}
.w1 .plank{height:7px;background:linear-gradient(#f3d2a2,#b07a40);margin:0 -14px 0 -6px;border-radius:3px 10px 10px 3px;transform:translateY(calc(var(--sz)*-.48));box-shadow:0 2px 3px rgba(0,0,0,.5);clip-path:polygon(0 0,94% 0,100% 50%,94% 100%,0 100%);z-index:0}
.w1 .plank::after{display:none}
.w2 .plank{background:linear-gradient(#fff,#f9a8d4);box-shadow:0 3px 0 #db2777}
.w3 .plank{background:linear-gradient(#fcd34d,#f59e0b);box-shadow:0 3px 0 #b45309}
.w3 .shelf:nth-child(3n+2) .plank{background:linear-gradient(#f9a8d4,#ec4899);box-shadow:0 3px 0 #9d174d}.w3 .shelf:nth-child(3n) .plank{background:linear-gradient(#86efac,#22c55e);box-shadow:0 3px 0 #15803d}
.shelf.small .plank{filter:hue-rotate(150deg) saturate(.8)}
.shelf.bonus{box-shadow:0 0 0 3px #4ade80,inset 0 6px 10px rgba(0,0,0,.3)}.shelf.bonus .plank{background:linear-gradient(#86efac,#16a34a)}
.shelf .ly{position:absolute;right:-3px;top:-3px;z-index:4;background:linear-gradient(#475569,#0f172a);color:#fde68a;font-size:12px;font-weight:700;border-radius:10px;padding:0 6px;border:2px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.lockov{position:absolute;inset:0;z-index:5;border-radius:inherit;background:repeating-linear-gradient(45deg,rgba(15,23,42,.66) 0 10px,rgba(30,41,59,.78) 10px 20px);display:flex;align-items:center;justify-content:center;gap:5px;font-weight:700;font-size:20px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}
.lockov b{background:linear-gradient(#fde047,#f59e0b);color:#422006;border:2px solid #fff;border-radius:12px;padding:0 8px;font-size:16px}
.lockov.gone{animation:lkgone .6s forwards;pointer-events:none}@keyframes lkgone{30%{transform:scale(1.08)}to{opacity:0;transform:scale(1.25)}}
/* judančios lentynos */
#conv{display:none;position:relative;overflow:hidden;margin-top:8px;border-radius:16px;background:repeating-linear-gradient(90deg,#334155 0 14px,#475569 14px 28px);border:3px solid #e2e8f0;box-shadow:inset 0 4px 8px rgba(0,0,0,.5),0 5px 0 #0f172a}
#elev{display:none;position:relative;overflow:hidden;border-radius:16px;border:3px solid #e2e8f0;background:linear-gradient(90deg,#94a3b8 0 5px,transparent 5px calc(100% - 5px),#94a3b8 calc(100% - 5px)),repeating-linear-gradient(180deg,rgba(51,65,85,.7) 0 3px,rgba(148,163,184,.35) 3px 26px);box-shadow:inset 0 0 10px rgba(0,0,0,.5),0 5px 0 #0f172a}
#conv .shelf,#elev .shelf{position:absolute;left:0;top:0;will-change:transform;transition:none}
/* kombo, antraštė, ranka */
#combo{position:absolute;left:50%;top:0;z-index:8;transform:translate(-50%,-160%);background:linear-gradient(#fb923c,#dc2626);border:3px solid #fed7aa;border-radius:999px;padding:2px 14px 8px;font-weight:700;font-size:16px;white-space:nowrap;box-shadow:0 4px 0 #7f1d1d,0 6px 14px rgba(0,0,0,.3);transition:transform .3s cubic-bezier(.3,1.6,.5,1),opacity .2s;opacity:0;visibility:hidden;pointer-events:none;text-shadow:0 2px 0 rgba(127,29,29,.6)}
#combo.on{transform:translate(-50%,2px);opacity:1;visibility:visible}#combo.pop{animation:cpop .3s}@keyframes cpop{50%{transform:translate(-50%,2px) scale(1.25)}}
#combo i{position:absolute;left:10px;right:10px;bottom:3px;height:4px;background:rgba(0,0,0,.35);border-radius:3px;overflow:hidden}#combo i u{display:block;height:100%;width:100%;background:#fde047;border-radius:3px}
#banner{position:absolute;left:50%;top:38%;z-index:9;transform:translate(-50%,-50%) scale(.4);opacity:0;pointer-events:none;text-align:center;white-space:nowrap}
#banner b{display:block;font-size:44px;font-weight:700;line-height:1;color:#fff;-webkit-text-stroke:2px #4c1d95;paint-order:stroke fill;text-shadow:0 5px 0 #4c1d95,0 10px 20px rgba(0,0,0,.35)}
#banner span{display:table;margin:7px auto 0;background:rgba(15,23,42,.75);border-radius:999px;padding:5px 14px;font-size:15px;font-weight:600}
#banner.show{animation:bnr 2.1s cubic-bezier(.3,1.4,.5,1) forwards}
@keyframes bnr{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}14%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}22%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-80%) scale(.9)}}
#hand{position:fixed;left:0;top:0;z-index:25;font-size:46px;line-height:1;pointer-events:none;display:none;filter:drop-shadow(0 6px 4px rgba(0,0,0,.4))}
/* ================= APAČIA: PAGALBOS ================= */
#bar{display:flex;justify-content:space-around;padding:10px 4px calc(10px + env(safe-area-inset-bottom,0px));position:relative;z-index:5}
.bst{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;width:58px}
.bst .c{position:relative;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;font-style:normal;background:radial-gradient(circle at 50% 32%,#fff 0,#e0e7ff 45%,#a5b4fc 100%);border:3px solid #fff;box-shadow:0 4px 0 #3730a3,0 6px 10px rgba(0,0,0,.3);transition:transform .08s}
.bst:active .c{transform:translateY(3px);box-shadow:0 1px 0 #3730a3}
.bst small{position:absolute;top:-7px;right:-9px;min-width:22px;background:linear-gradient(#fcd34d,#f59e0b);color:#78350f;font-size:11px;font-weight:700;border-radius:10px;padding:0 5px;border:2px solid #fff;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.bst small.own{background:linear-gradient(#86efac,#16a34a);color:#fff}
.bst span{font-size:11px;font-weight:600;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.bst:disabled{cursor:default}.bst:disabled .c{filter:grayscale(1) brightness(.85);opacity:.55;box-shadow:0 4px 0 #475569}.bst:disabled span{opacity:.55}
/* ================= EFEKTAI ================= */
#fx{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.fly{position:absolute;left:0;top:0;display:flex;align-items:center;justify-content:center;line-height:1;text-shadow:0 0 2px #fff,0 12px 10px rgba(0,0,0,.35);will-change:transform}
.pop{position:absolute;left:0;top:0;display:flex;align-items:center;justify-content:center;line-height:1;text-shadow:0 0 2px #fff,0 4px 4px rgba(0,0,0,.35)}
.spk{position:absolute;left:0;top:0;width:9px;height:9px;border-radius:50%}
.ring{position:absolute;left:0;top:0;border-radius:50%;border:5px solid #fde047;box-shadow:0 0 16px #fde047,inset 0 0 12px #fde047}
.flash{position:absolute;left:0;top:0;border-radius:50%;background:radial-gradient(circle,#fff 0,rgba(255,255,255,.7) 30%,transparent 70%)}
.str{position:absolute;left:0;top:0;font-size:18px;line-height:1}
.cmb{position:absolute;left:0;top:0;font-weight:700;font-size:34px;white-space:nowrap;color:#fff;-webkit-text-stroke:2px #9a3412;paint-order:stroke fill;text-shadow:0 4px 0 #9a3412,0 8px 14px rgba(0,0,0,.35);text-align:center}
.cmb small{display:block;font-size:18px;-webkit-text-stroke:1px #9a3412;text-shadow:0 2px 0 #9a3412}
.fcoin,.fstar{position:absolute;left:0;top:0;font-size:24px;line-height:1;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}
#conf{position:fixed;inset:0;z-index:31;pointer-events:none}
#board.shk{animation:bshk .4s}@keyframes bshk{20%{transform:translate(-6px,2px)}40%{transform:translate(6px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,0)}}
body.hurry #board{animation:hurry 1s infinite alternate}@keyframes hurry{from{box-shadow:inset 0 0 50px rgba(239,68,68,.55)}to{box-shadow:inset 0 0 18px rgba(239,68,68,.2)}}
@keyframes pulse{to{opacity:.6}}
/* ================= LANGAI (šviesios kortelės) ================= */
#overlay{position:fixed;inset:0;background:rgba(15,10,40,.62);display:none;align-items:center;justify-content:center;z-index:30}
#overlay.show{display:flex}
.card{position:relative;background:linear-gradient(#ffffff,#eef2ff);color:var(--ink);border:4px solid #fff;border-radius:26px;padding:24px 20px 20px;width:min(340px,90vw);max-height:92vh;overflow:auto;text-align:center;display:flex;flex-direction:column;gap:11px;box-shadow:0 10px 0 rgba(30,27,75,.35),0 24px 60px rgba(0,0,0,.45);animation:cardIn .4s cubic-bezier(.3,1.5,.5,1)}
@keyframes cardIn{from{transform:scale(.7) translateY(30px);opacity:0}}
.card h2{margin:0;font-size:26px;font-weight:700;color:#4c1d95}.card p{margin:0;color:#475569;font-size:15px}
.card .coin{color:#b45309;font-weight:700}
.card button{border-radius:14px;padding:11px 16px;font-size:16px;font-weight:600;color:#1e293b;background:linear-gradient(#f8fafc,#cbd5e1);border:2px solid #fff;box-shadow:0 4px 0 #64748b}
.card button:active{transform:translateY(3px);box-shadow:0 1px 0 #64748b}
.card button:disabled{opacity:.45}
.card button.primary{color:#fff;font-weight:700;background:linear-gradient(#60a5fa,#2563eb);border:2px solid #bfdbfe;box-shadow:0 4px 0 #1e3a8a;text-shadow:0 2px 0 rgba(30,58,138,.5)}
.card button.cont{color:#fff;font-weight:700;background:linear-gradient(#4ade80,#16a34a);border-color:#bbf7d0;box-shadow:0 4px 0 #14532d;text-shadow:0 2px 0 rgba(20,83,45,.5)}
.card button.danger{color:#fff;background:linear-gradient(#f87171,#dc2626);border-color:#fecaca;box-shadow:0 4px 0 #7f1d1d}
.card button.big{font-size:20px;padding:14px}
.pulse{animation:btnp 1.1s ease-in-out infinite}@keyframes btnp{50%{transform:scale(1.05)}}
.ribbon{position:relative;margin:-4px auto 0;display:inline-block;padding:6px 22px 8px;font-size:26px;white-space:nowrap;font-weight:700;color:#fff;background:linear-gradient(#f472b6,#db2777);border-radius:14px;box-shadow:0 4px 0 #9d174d;text-shadow:0 2px 0 #9d174d}
.ribbon.lose{background:linear-gradient(#94a3b8,#64748b);box-shadow:0 4px 0 #334155;text-shadow:0 2px 0 #334155}
.ribbon.gold{background:linear-gradient(#fcd34d,#f59e0b);box-shadow:0 4px 0 #b45309;text-shadow:0 2px 0 #b45309}
.ribbon.blue{background:linear-gradient(#60a5fa,#2563eb);box-shadow:0 4px 0 #1e3a8a;text-shadow:0 2px 0 #1e3a8a}
.bigstars{display:flex;justify-content:center;align-items:flex-end;gap:2px;margin:2px 0}
.bigstars i{font-style:normal;font-size:48px;line-height:1;color:#cbd5e1;text-shadow:0 3px 0 #94a3b8}
.bigstars i:nth-child(1),.bigstars i:nth-child(4){font-size:40px}
.bigstars i.on{color:#fbbf24;text-shadow:0 3px 0 #b45309,0 0 16px rgba(251,191,36,.8);animation:starIn .45s cubic-bezier(.3,1.8,.5,1) backwards}
@keyframes starIn{from{transform:scale(2.6) rotate(-40deg);opacity:0}}
.sbrk{display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:12.5px;text-align:left}
.sbrk span{background:#e2e8f0;color:#64748b;border-radius:10px;padding:4px 8px;line-height:1.2}.sbrk .on{background:#fef3c7;color:#92400e}
.rew{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.rew span{display:flex;align-items:center;gap:4px;background:linear-gradient(#fef3c7,#fcd34d);color:#78350f;border:2px solid #fff;border-radius:999px;padding:3px 12px;font-weight:700;font-size:18px;box-shadow:0 3px 0 #d97706}
.rew span.st{background:linear-gradient(#fed7aa,#fb923c);color:#7c2d12;box-shadow:0 3px 0 #c2410c;font-size:15px}
.chest{display:flex;align-items:center;gap:8px;background:#ede9fe;border-radius:14px;padding:6px 10px;font-weight:600;font-size:14px;color:#5b21b6}
.chest b{font-size:26px}.chest .cb{flex:1;height:12px;background:#ddd6fe;border-radius:8px;overflow:hidden;box-shadow:inset 0 2px 2px rgba(0,0,0,.1)}.chest .cb i{display:block;height:100%;background:linear-gradient(90deg,#a78bfa,#7c3aed);border-radius:8px;transition:width .8s cubic-bezier(.3,1.3,.5,1)}
.chest.full b{animation:shakeC .5s infinite}@keyframes shakeC{25%{transform:rotate(-12deg) scale(1.1)}75%{transform:rotate(12deg) scale(1.1)}}
.pct{position:relative;height:20px;background:#e2e8f0;border-radius:10px;overflow:hidden}.pct i{display:block;height:100%;background:linear-gradient(90deg,#f59e0b,#fbbf24);border-radius:10px}.pct b{position:absolute;inset:0;font-size:13px;line-height:20px;color:#78350f}
.warnS{background:#fee2e2;color:#991b1b!important;border-radius:10px;padding:5px 8px;font-size:13px!important;font-weight:600}
.pm{display:flex;flex-direction:column;gap:8px}.pm2{display:flex;gap:8px}.pm2 button{flex:1;padding:10px 6px;font-size:15px;white-space:nowrap}
.hl{display:flex;flex-direction:column;gap:8px;text-align:left;max-height:60vh;overflow:auto}.hl>div{display:flex;gap:10px;align-items:flex-start;background:#f1f5f9;border-radius:14px;padding:9px}
.hl b{font-size:28px;line-height:1;flex:none;width:36px;text-align:center}.hl p{margin:0;color:#475569;font-size:14px}.hl p strong{color:#1e293b;display:block;font-size:15px}
.hl div .bb{margin-left:auto;flex:none;align-self:center;padding:7px 10px;font-size:14px}
.newm{font-size:66px;line-height:1;animation:newm 1.6s ease-in-out infinite}@keyframes newm{50%{transform:scale(1.12) rotate(-6deg)}}
.chestbig{font-size:88px;line-height:1;margin:6px 0}.chestbig.shake{animation:shakeC .3s infinite}.chestbig.open{animation:chOpen .5s cubic-bezier(.3,1.8,.5,1)}@keyframes chOpen{from{transform:scale(.3)}}
.loot{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.loot span{display:flex;flex-direction:column;align-items:center;background:#f1f5f9;border-radius:14px;padding:6px 10px;font-weight:700;font-size:13px;color:#334155;animation:starIn .45s cubic-bezier(.3,1.8,.5,1) backwards}.loot span b{font-size:30px}
/* ================= ŽEMĖLAPIS ================= */

.mtop{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 8px;background:linear-gradient(#6d28d9,#4c1d95);box-shadow:0 4px 12px rgba(0,0,0,.35);z-index:6}
.mtop b{font-size:20px;font-weight:700}.mtop .sp{margin-left:auto;display:flex;gap:6px}.mtop .sp span{background:rgba(0,0,0,.3);border-radius:999px;padding:3px 10px;font-weight:600;font-size:14px}
.mtop button{width:40px;height:40px;border-radius:12px;border:2px solid #fff;background:linear-gradient(#f87171,#dc2626);box-shadow:0 3px 0 #7f1d1d;color:#fff;font-size:18px;padding:0}
.map{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;-webkit-overflow-scrolling:touch}
.mapIn{position:relative;width:100%}
.stg{position:absolute;left:0;right:0;overflow:hidden}
.stg.s0{background:linear-gradient(#0e7490,#22d3ee)}.stg.s1{background:linear-gradient(#7c2d12,#f97316)}.stg.s2{background:linear-gradient(#9d174d,#f9a8d4)}.stg.s3{background:linear-gradient(#3730a3,#a5b4fc)}
.stg::before{content:'';position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.22) 2px,transparent 3px) 0 0/34px 34px}

.stgT{position:absolute;left:50%;transform:translate(-50%,-50%);z-index:3;background:linear-gradient(#fcd34d,#f59e0b);color:#78350f;border:3px solid #fff;border-radius:16px;padding:3px 16px 5px;font-weight:700;font-size:17px;white-space:nowrap;box-shadow:0 4px 0 #b45309,0 8px 16px rgba(0,0,0,.3);text-align:center}
.stgT small{display:block;font-size:11px;font-weight:600;color:#92400e}
.deco{position:absolute;font-size:30px;opacity:.5;z-index:1;pointer-events:none}
.nd{position:absolute;z-index:2;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:4px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:19px;color:#fff;padding:0;background:linear-gradient(#4ade80,#16a34a);box-shadow:0 5px 0 #14532d,0 8px 14px rgba(0,0,0,.35);text-shadow:0 2px 0 rgba(0,0,0,.3)}
.nd.lock{background:linear-gradient(#cbd5e1,#64748b);box-shadow:0 5px 0 #334155;color:#e2e8f0}

.nd.boss{width:66px;height:66px;margin:-33px 0 0 -33px;background:linear-gradient(#fb923c,#dc2626);box-shadow:0 5px 0 #7f1d1d,0 8px 14px rgba(0,0,0,.35)}
.nd.big{width:76px;height:76px;margin:-38px 0 0 -38px;background:linear-gradient(#c084fc,#7c3aed);box-shadow:0 6px 0 #4c1d95,0 8px 14px rgba(0,0,0,.35);font-size:22px}
.nd.boss.lock,.nd.big.lock{filter:grayscale(.7) brightness(.9)}
.nd.cur.boss,.nd.cur.big{animation:ndp 1.2s ease-in-out infinite}
.nd .ks{position:absolute;top:-19px;font-size:22px;text-shadow:none}
.nd .st{position:absolute;bottom:-18px;font-size:13px;letter-spacing:-1px;color:#fde047;text-shadow:0 1px 2px rgba(0,0,0,.7);white-space:nowrap}.nd .st u{text-decoration:none;color:rgba(255,255,255,.5)}
.nd .mk{position:absolute;right:-20px;top:-10px;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle,#fff7cc,#fcd34d);border:2px solid #fff;font-size:16px;display:flex;align-items:center;justify-content:center;text-shadow:none;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.pin{position:absolute;z-index:4;font-size:40px;line-height:1;margin:-76px 0 0 -20px;animation:pinb 1s ease-in-out infinite;pointer-events:none;filter:drop-shadow(0 6px 3px rgba(0,0,0,.35))}@keyframes pinb{50%{transform:translateY(-10px)}}
.fog{position:absolute;left:0;right:0;top:0;z-index:3;display:flex;align-items:flex-start;justify-content:center;padding-top:18px;background:linear-gradient(#0f172a 35%,rgba(15,23,42,0));font-weight:600;color:#cbd5e1;pointer-events:none}
.mplay{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:12px 14px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.55));display:flex;justify-content:center;pointer-events:none}
.mplay button{pointer-events:auto;border-radius:18px;padding:12px 34px;font-size:21px;font-weight:700;color:#fff;background:linear-gradient(#4ade80,#16a34a);border:3px solid #fff;box-shadow:0 5px 0 #14532d,0 10px 20px rgba(0,0,0,.4);text-shadow:0 2px 0 #14532d;animation:btnp 1.2s ease-in-out infinite}
/* ================= PAGRINDINIS MENIU ================= */
#home{position:fixed;inset:0;z-index:29;display:none;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(130% 85% at 50% 0%,#c4b5fd 0,#8b5cf6 30%,#5b21b6 65%,#1e1b4b 100%)}
#home.show{display:flex}
#home::before{content:'';position:absolute;left:50%;top:30%;width:240vmax;height:240vmax;margin:-120vmax 0 0 -120vmax;background:repeating-conic-gradient(rgba(255,255,255,.1) 0 8deg,transparent 8deg 16deg);animation:spin 80s linear infinite}
.hfl{position:absolute;bottom:-80px;opacity:.3;animation:floatUp linear infinite;font-size:34px;pointer-events:none}
.hm{position:relative;width:min(340px,88vw);display:flex;flex-direction:column;gap:10px;text-align:center}
.htop{position:fixed;top:calc(12px + env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:2}
.htop span{background:rgba(15,23,42,.45);border-radius:999px;padding:4px 12px;font-weight:600;font-size:15px;box-shadow:inset 0 2px 0 rgba(255,255,255,.12)}
.hlogo{margin:0 auto 2px;display:flex;flex-direction:column;align-items:center}
.hlogo div{font-size:52px;display:flex;gap:6px;text-shadow:0 0 2px #fff,0 6px 6px rgba(0,0,0,.35)}
.hlogo div span{display:inline-block;animation:hop 1.4s ease-in-out infinite}.hlogo div span:nth-child(2){animation-delay:.18s}.hlogo div span:nth-child(3){animation-delay:.36s}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-18px) rotate(-8deg)}60%{transform:translateY(0) scale(1.12,.88)}}
.hlogo i{display:block;width:200px;height:14px;border-radius:5px;background:linear-gradient(#d8955a,#9a5b24);box-shadow:0 4px 0 #5e3410,0 10px 12px rgba(0,0,0,.3)}
.hm h1{margin:4px 0 0;font-size:46px;line-height:1;font-weight:700;color:#fff;-webkit-text-stroke:3px #4c1d95;paint-order:stroke fill;text-shadow:0 6px 0 #4c1d95,0 12px 24px rgba(0,0,0,.35)}
.hm h1 span{display:block;color:#fde047}
.hst{margin:2px 0 4px;font-weight:600;color:#ede9fe}
.hm button{border-radius:18px;font-weight:700;color:#1e293b;background:linear-gradient(#fff,#e0e7ff);border:3px solid #fff;box-shadow:0 5px 0 #4338ca,0 8px 16px rgba(0,0,0,.25);padding:12px;font-size:17px}
.hm button:active{transform:translateY(4px);box-shadow:0 1px 0 #4338ca}
.hm button.big{font-size:26px;padding:14px;color:#fff;background:linear-gradient(#4ade80,#16a34a);border-color:#dcfce7;box-shadow:0 6px 0 #14532d,0 10px 20px rgba(0,0,0,.3);text-shadow:0 2px 0 #14532d;animation:btnp 1.3s ease-in-out infinite}
.hm button.big small{display:block;font-size:14px;font-weight:600;opacity:.95}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tiles button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 6px;font-size:15px}
.tiles button b{font-size:30px;line-height:1.1}.tiles button small{font-size:12px;font-weight:600;color:#6366f1}
.tiles button.hot{background:linear-gradient(#fef9c3,#fde68a)}
.hchips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.hchips span{display:flex;align-items:center;gap:6px;background:rgba(15,23,42,.45);border-radius:999px;padding:4px 12px;font-weight:600;font-size:14px}
.hchips .cb{display:inline-block;width:56px;height:8px;border-radius:5px;background:rgba(255,255,255,.25);overflow:hidden}.hchips .cb i{display:block;height:100%;background:#c4b5fd}
.ver{opacity:.6;font-size:12px;text-align:center;margin-top:6px}
/* ================= KITA ================= */
#toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.85);background:rgba(30,27,75,.92);border:3px solid rgba(255,255,255,.85);padding:12px 22px;border-radius:20px;font-size:22px;font-weight:700;opacity:0;transition:all .3s cubic-bezier(.3,1.5,.5,1);z-index:29;pointer-events:none;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#toast small{display:block;font-size:14px;font-weight:500;color:#c7d2fe;margin-top:2px}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.chip{position:fixed;left:50%;top:calc(100px + env(safe-area-inset-top));z-index:40;display:flex;align-items:center;gap:8px;background:linear-gradient(#fff,#ede9fe);color:#4c1d95;border:3px solid #fff;border-radius:999px;padding:4px 14px 4px 6px;font-weight:700;font-size:14px;box-shadow:0 4px 0 #6d28d9,0 8px 18px rgba(0,0,0,.3);pointer-events:none;white-space:nowrap}
.chip b{font-size:28px;line-height:1}
.achb{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));z-index:80;display:flex;gap:10px;align-items:center;background:linear-gradient(#fff,#fef3c7);color:#1e293b;border:3px solid #fbbf24;border-radius:16px;padding:8px 14px;box-shadow:0 8px 24px rgba(0,0,0,.4);min-width:260px}
.achb b{font-size:30px}.achb small{display:block;color:#b45309;font-weight:700;font-size:11px}.achb strong{display:block;font-size:16px}.achb span{font-size:12px;color:#64748b}
.achl{display:flex;flex-direction:column;gap:6px;max-height:58vh;overflow:auto;text-align:left}
.acha{display:flex;gap:10px;align-items:center;background:#f1f5f9;border-radius:12px;padding:7px 9px;opacity:.8}.acha.got{opacity:1;background:#fef3c7}
.acha b{font-size:24px}.acha div{flex:1}.acha strong{display:block;font-size:14px}.acha span{font-size:12px;color:#64748b}
.acha i{display:block;height:5px;background:#e2e8f0;border-radius:3px;margin-top:4px;overflow:hidden}.acha u{display:block;height:100%;background:#f59e0b}.acha small{font-size:10px;color:#64748b}.acha em{font-style:normal;font-size:12px;font-weight:700;color:#b45309}
.alb{display:flex;flex-direction:column;gap:10px;max-height:60vh;overflow:auto;text-align:left}
.alb h3{margin:0;font-size:15px;display:flex;justify-content:space-between;color:#334155}.alb h3 small{color:#7c3aed}
.alb .ag{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;background:#f1f5f9;border-radius:12px;padding:6px}
.alb .ag i{font-style:normal;font-size:26px;text-align:center;line-height:1.25}.alb .ag i.no{filter:brightness(0);opacity:.13}
.alb .done .ag{background:#dcfce7}
#upd{position:fixed;left:8px;right:8px;top:calc(58px + env(safe-area-inset-top));z-index:60;max-width:464px;margin:0 auto;display:none;align-items:center;gap:10px;background:#0f766e;color:#fff;border-radius:14px;padding:10px 12px;font-weight:600;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.35)}#upd.show{display:flex}#upd b{flex:1}#upd button{border:0;border-radius:10px;padding:9px 12px;font-weight:700;font-size:14px;background:#fff;color:#0f766e}#upd .x{background:transparent;color:#fff;padding:9px 6px}

.stats i{font-style:normal}
/* ===== užsakymai ===== */
#orders{display:none;gap:6px;justify-content:center;align-items:stretch;padding:2px 8px 8px;position:relative;z-index:4;min-height:0}
#orders.on{display:flex}
.ord{position:relative;display:flex;align-items:center;gap:4px;background:linear-gradient(#fff,#e0e7ff);color:#1e293b;border:3px solid #fff;border-radius:16px;padding:3px 7px 3px 4px;box-shadow:0 4px 0 #6366f1,0 6px 12px rgba(0,0,0,.25)}
.ord.new{animation:ordIn .5s cubic-bezier(.3,1.6,.5,1)}@keyframes ordIn{from{transform:translateY(-30px) scale(.5);opacity:0}}
.ord.done{animation:ordDone .8s forwards;background:linear-gradient(#dcfce7,#86efac)}@keyframes ordDone{25%{transform:scale(1.15)}60%{transform:scale(1.1)}100%{transform:translateY(-36px) scale(.6);opacity:0}}
.ord .who{font-size:28px;line-height:1}
.ord .its{display:flex;gap:3px}
.ord .its i{position:relative;font-style:normal;font-size:21px;line-height:1.25;padding:1px 3px;border-radius:9px;background:#e0e7ff;box-shadow:inset 0 2px 3px rgba(0,0,0,.12)}
.ord .its i.ok{background:#bbf7d0}
.ord .its i.ok::after{content:'✓';position:absolute;right:-5px;bottom:-5px;font-size:11px;font-weight:700;color:#fff;background:#16a34a;border-radius:50%;width:16px;height:16px;line-height:13px;text-align:center;border:2px solid #fff}
.ord .bub{position:absolute;top:-15px;left:50%;transform:translateX(-50%);background:#16a34a;color:#fff;font-size:12px;font-weight:700;border-radius:10px;padding:0 8px;white-space:nowrap;border:2px solid #fff}
.oq{align-self:center;background:rgba(15,23,42,.55);border-radius:999px;padding:3px 9px;font-weight:700;font-size:14px}
/* ===== gendančios ir sugedusios prekės ===== */
.it .pt{position:absolute;left:-5px;top:-5px;z-index:3;font-style:normal;font-size:11px;font-weight:700;line-height:15px;padding:0 5px;border-radius:9px;background:linear-gradient(#fef08a,#f59e0b);color:#78350f;border:2px solid #fff;text-shadow:none;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.it .pt.low{background:linear-gradient(#fca5a5,#dc2626);color:#fff;animation:pulse .45s infinite alternate}
.it.junk{cursor:pointer;text-shadow:none;animation:junkW 1.8s ease-in-out infinite}
.it.junk .jx{filter:sepia(.9) hue-rotate(55deg) saturate(1.4) brightness(.72)}
.w1 .it.junk .jx{filter:brightness(.22) sepia(.7)}
.w2 .it.junk .jx,.w4 .it.junk .jx{filter:saturate(.5) brightness(1.15) blur(.5px);display:inline-block;transform:scaleY(.72) translateY(16%)}
.w3 .it.junk .jx{filter:grayscale(1) brightness(.7)}
.it.junk sub{position:absolute;right:-4px;top:-8px;font-size:calc(var(--sz)*.34);animation:junkF 1s ease-in-out infinite alternate}

const kindOf=L=>{if(isEv(L)){const d=L-EVENT0;return d===24?'big':d===12?'boss':'n'}const q=qOf(L);return q===STAGE?'big':(q%10===5&&q>5)?'boss':'n'},KICON={n:'',boss:' 🔥',big:' 👑'};
/* etapas = 95 lygiai: 1–5 apšilimas, tada kas 10 lygių nauja kliūtis (6, 16, 26 … 86); po 95 – vėl nuo lengviausio */
const MECH_ORDER=['lock','orders','conv','frozen','perish','elev','hidden','dark','small'],MECH_Q=[6,16,26,36,46,56,66,76,86];
const MECH_IL=MECH_Q;
function mechsOf(L){
  const c=cyc(L),q=qOf(L),pr=rng(L*977+5),kd=kindOf(L);
  const idx=MECH_Q.filter(x=>x<=q).length-1;if(idx<0)return [];

  let extra=Math.floor(idx/2)+(pos>=5?1:0)+Math.min(1,Math.floor(c/3))+(kd==='big'?3:kd==='boss'?1:0);
  if(pos<3&&kd==='n')extra=0;                       // pirmi 3 lygiai – naujovė viena
  if(q%3===2&&kd==='n')extra=Math.max(0,extra-1);   // atokvėpio lygiai

  if(d%3!==0)on.add('orders');if(d>=4&&d%2===0)on.add('perish');
  const pool=shuffle(['lock','conv','frozen','elev','hidden','dark','small'],pr),extra=d<6?0:d<12?1:d<20?2:3;for(let i=0;i<extra;i++)on.add(pool[i]);

  const ev=isEv(L),d=ev?L-EVENT0:0,c=ev?0:cyc(L),q=ev?d:qOf(L),pr=rng(L*1013+11),kd=kindOf(L);

    const rest=shuffle(ALL_GOODS.filter(x=>!W.items.includes(x)),r2),mixN=c>=2?Math.round(K*.3):0;

}
/* --- lygio kūrimas atbuline eiga: nuo tuščių lentynų „atžaidžiam“ sprendimą atgal,

function buildRev(p,r){
  const caps=[];for(let i=0;i<p.S;i++)caps.push(3);for(let i=0;i<p.mech.small;i++)caps.push(2);shuffle(caps,r);

    const j=fr[Math.floor(r()*fr.length)];A.front[j]=c;if(isTri(A.front)){A.front[j]=null;return false}B.front[k]=null;ops.push({a,ia:j,b,ib:k,match});return true};

function tone(o){

}

 {id:'streak7',ic:'🔥',n:'Savaitė be pertraukos',d:'7 dienų dienos iššūkių serija',k:'streak',t:7,r:70},
 {id:'help',ic:'🧰',n:'Pagalbos ranka',d:'Panaudok pagalbą',k:'boost',t:1,r:5},
 {id:'ws5',ic:'🔥',n:'Karšta serija',d:'Įveik 5 lygius iš eilės nepralaimėjęs',k:'wstreak',t:5,r:25},
 {id:'ws15',ic:'☄️',n:'Nesustabdomas',d:'Įveik 15 lygių iš eilės nepralaimėjęs',k:'wstreak',t:15,r:80},
 {id:'alb50',ic:'📒',n:'Kolekcionierius',d:'Surink 50 prekių į kolekciją',k:'album',t:50,r:40},
 {id:'alb178',ic:'📚',n:'Visa parduotuvė',d:'Surink visas 178 prekes',k:'album',t:178,r:300},
 {id:'ord50',ic:'🧾',n:'Užsakymų meistras',d:'Įvykdyk 50 užsakymų',k:'orders',t:50,r:40},
 {id:'adv24',ic:'🎄',n:'Advento kalendorius',d:'Atidaryk visas 24 dureles',k:'adv',t:24,r:200},
];
function achStats(){const s=store.get('prekes.ach',{c:{},got:{}});s.c=s.c||{};s.got=s.got||{};return s}
function achVal(k,s){let v=0;
  if(k==='lv')return Object.keys(best).filter(l=>best[l]>0).length;
  if(k==='s4')return Object.keys(best).filter(l=>best[l]>=4).length;
  if(k==='stars'){for(const l in best)v+=best[l]||0;return v}
  if(k==='boss')return Object.keys(best).filter(l=>best[l]>0&&kindOf(+l)!=='n').length;
  if(k==='world')return Object.keys(best).filter(l=>best[l]>0&&qOf(+l)===STAGE).length;
  if(k==='album')return ALL_GOODS.filter(x=>ALBUM[x]).length;
  if(k==='adv')return Object.keys(advState()).length;
  return s.c[k]||0}
function achAdd(k,n){if(tmOn())return;const s=achStats();s.c[k]=(s.c[k]||0)+n;store.set('prekes.ach',s);achCheck()}
function achSet(k,v){if(tmOn())return;const s=achStats();s.c[k]=Math.max(s.c[k]||0,v);store.set('prekes.ach',s);achCheck()}
function achCheck(){const s=achStats(),fresh=[];ACH.forEach(a=>{if(!s.got[a.id]&&achVal(a.k,s)>=a.t){s.got[a.id]=Date.now();fresh.push(a)}});
  if(!fresh.length)return;store.set('prekes.ach',s);
  fresh.forEach((a,i)=>setTimeout(()=>{addCoins(a.r);sfx('unlock');achBanner(a);renderHUD()},600+i*2600))}
function achBanner(a){const e=document.createElement('div');e.className='achb';e.innerHTML=`<b>${a.ic}</b><div><small>🏆 Pasiekimas</small><strong>${a.n}</strong><span>${a.d} · 🪙 +${a.r}</span></div>`;document.body.appendChild(e);
  e.animate([{transform:'translate(-50%,-140%)'},{transform:'translate(-50%,0)',offset:.12},{transform:'translate(-50%,0)',offset:.88},{transform:'translate(-50%,-140%)'}],{duration:2500,easing:'ease-in-out'}).onfinish=()=>e.remove()}
function openAch(back){const s=achStats(),n=ACH.filter(a=>s.got[a.id]).length;
  showCard(`<h2>🏆 Pasiekimai</h2><p>${n} / ${ACH.length}</p><div class="achl">${ACH.map(a=>{const got=s.got[a.id],v=Math.min(a.t,achVal(a.k,s));
    return `<div class="acha${got?' got':''}"><b>${a.ic}</b><div><strong>${a.n}</strong><span>${a.d}</span>${got?'':`<i><u style="width:${v/a.t*100}%"></u></i><small>${v} / ${a.t}</small>`}</div><em>${got?'✅':'🪙 '+a.r}</em></div>`}).join('')}</div><button id="ab">← Atgal</button>`);
  $('ab').onclick=()=>back?back():closeCard()}
/* ===================== PREKIŲ KOLEKCIJA ===================== */
function openAlbum(back){const n=Object.keys(ALBUM).length,TOT=ALL_GOODS.length+XMAS.items.length;
  showCard(`<div class="ribbon">Kolekcija</div><p>Surinkta <b>${n}</b> iš ${TOT} prekių. Prekė patenka į kolekciją, kai pirmą kartą išvalai jos trejetą. Už visą grupę – 🪙 100.</p>
    <div class="alb">${CATS.map(([k,ic,nm])=>{const L=CATL(k),have=L.filter(x=>ALBUM[x]).length;return `<div class="${have===L.length?'done':''}"><h3>${ic} ${nm}<small>${have===L.length?'✅ ':''}${have}/${L.length}</small></h3><div class="ag">${L.map(x=>`<i class="${ALBUM[x]?'':'no'}">${x}</i>`).join('')}</div></div>`}).join('')}</div>
    <button id="alx">${back?'← Atgal':'Uždaryti'}</button>`);
  $('alx').onclick=()=>back?back():closeCard()}
/* ===================== KALĖDŲ RENGINYS: ADVENTO KALENDORIUS ===================== */
function advInfo(now=new Date()){const y=now.getFullYear(),m=now.getMonth(),d=now.getDate();
  if(m===10&&d>=15)return {y,pre:true,open:1};          // lapkričio antroji pusė – galima išbandyti 1 dureles
  if(m===11)return {y,pre:false,open:Math.min(24,d)};   // gruodį kasdien atsidaro naujos durelės
  if(m===0&&d<=6)return {y:y-1,pre:false,open:24};      // iki Trijų Karalių – visos
  return null}
const snowSeason=()=>{const n=new Date();return n.getMonth()===11||(n.getMonth()===0&&n.getDate()<=6)};
function advKey(){const A=advInfo();return 'prekes.adv'+(A?A.y:new Date().getFullYear())}
function advState(){return store.get(advKey(),{})}
function advTile(){const A=advInfo();if(!A&&!testMode)return '';const st=advState(),n=Object.keys(st).length,open=testMode?24:A?A.open:0,todo=open>0&&!st[open];
  return `<button id="hadv" class="advt${todo?' hot':''}"><b>🎄</b><span>Advento kalendorius<small>${A&&A.pre?'Nuo gruodžio 1 d. · išbandyk jau dabar!':`Atidaryta ${n}/24${todo?' · laukia naujos durelės!':''}`}</small></span></button>`}
const ADV_POS=shuffle([...Array(24).keys()].map(i=>i+1),rng(2412));
function openAdvent(back){const A=advInfo(),st=advState(),open=testMode?24:A?A.open:0;handHide();$('menu').classList.remove('show');
  showCard(`<div class="ribbon red">Advento kalendorius</div>
    <p>${!A&&!testMode?'Renginys vyksta gruodžio 1 – sausio 6 d.':A&&A.pre?'Renginys prasidės gruodžio 1 d. Pirmąsias dureles gali atidaryti jau dabar!':'Kiekvieną gruodžio dieną atsidaro naujos durelės su kalėdiniu lygiu ir dovana.'}</p>
    <div class="adv">${ADV_POS.map(d=>{const done=st[d],can=d<=open;return `<button class="dr${done?' done':can?' open':''}${d===24?' big':''}" data-d="${d}" ${can?'':'disabled'}><b>${d}</b><small>${done?'★'.repeat(done):can?(d===24?'🎁':'🎄'):'🔒'}</small></button>`}).join('')}</div>
    <p class="coin">Atidaryta ${Object.keys(st).length}/24 · už visas – didžioji dovana 🎁</p><button id="avx">${back?'← Atgal':'Uždaryti'}</button>`);
  $('avx').onclick=()=>{if(back)return back();closeCard();if(game&&game.status!=='play'&&!HOME.on){newGame(Math.min(unlocked,MAXL));showHome()}};
  document.querySelectorAll('.dr').forEach(b=>b.onclick=()=>{const d=+b.dataset.d;if(d>open)return;sfx('click');startAdvent(d)})}
function startAdvent(d){HOME.on=false;$('home').classList.remove('show');closeCard();DAILY.on=false;newGame(EVENT0+d,false,'event')}
function advWin(g0){const g=game,d=g.event,st=g.stars(),S=advState(),first=!S[d],TM=tmOn();let coins=0;const got={};
  if(!TM){S[d]=Math.max(S[d]||0,st);store.set(advKey(),S)}
  if(first&&!TM){coins=15+d*2;if(d%3===0||d===24){const ids=['undo','hint','shuffle','freeze','magnet','shelf'];for(let i=0;i<(d===24?3:1);i++){const id=ids[Math.floor(Math.random()*ids.length)];got[id]=(got[id]||0)+1}}
    if(d===24)coins+=150;if(Object.keys(S).length===24)coins+=300;addCoins(coins);for(const id in got)INV[id]=(INV[id]||0)+got[id];store.set('prekes.inv',INV);renderBar();achCheck()}
  sfx('win');buzz([40,60,40,60,120]);confetti();for(let i=0;i<st;i++)setTimeout(()=>sfx('star',i),420+i*260);
  const all=Object.keys(S).length===24;
  showCard(`<div class="ribbon red">${d===24?'Linksmų Kalėdų!':'Durelės '+d+'!'}</div><div class="newm">${d===24?'🎁':'🎄'}</div>
    <div class="bigstars">${[0,1,2,3].map(i=>`<i class="${i<st?'on':''}" style="animation-delay:${.3+i*.26}s">★</i>`).join('')}</div>
    ${TM?'<p class="coin">🧪 Testo režimas – dovanos neįskaitomos</p>':first?`<div class="loot"><span><b>🪙</b>+${coins}</span>${Object.keys(got).map(id=>{const b=BOOST.find(x=>x.id===id);return `<span><b>${b.ic}</b>${b.short} ×${got[id]}</span>`}).join('')}</div>${all?'<p class="coin">🎉 Atidarei visas 24 dureles!</p>':''}`:'<p>Šių durelių dovana jau gauta</p>'}
    <button class="cont big pulse" id="adk">🎄 Kalendorius</button><button id="adh">🏠 Pagrindinis meniu</button>`);
  $('adk').onclick=()=>openAdvent();$('adh').onclick=()=>{closeCard();newGame(Math.min(unlocked,MAXL));showHome()}}
/* ===================== PAGRINDINIS MENIU ===================== */
var HOME={on:false};
function showHome(){HOME.on=true;handHide();if(curWorld)setBg(curWorld);let tot=0;for(const k in best)tot+=best[k]||0;
  const front=Math.min(unlocked,MAXL),w=worldOf(front),s=achStats(),got=ACH.filter(a=>s.got[a.id]).length,al=Object.keys(ALBUM).length,r=rng(Date.now()%9973);
  let fl='';for(let i=0;i<10;i++)fl+=`<span class="hfl" style="left:${r()*92}%;animation-duration:${14+r()*14}s;animation-delay:${-r()*20}s">${ALL_GOODS[Math.floor(r()*ALL_GOODS.length)]}</span>`;
  const logo=w.items[Math.floor(r()*12)];
  $('home').innerHTML=`${fl}<div class="htop"><span>⭐ ${tot}</span><span>🪙 ${COINS}</span></div><div class="hm">
    <div class="hlogo"><div>${[0,1,2].map(()=>`<span>${logo}</span>`).join('')}</div><i></i></div>
    <h1>Prekių<span>rūšiuotojas</span></h1>
    <p class="hst">${w.emoji} ${w.name} · Etapas ${cyc(front)+1}</p>
    <button class="big" id="hpl">▶ Žaisti<small>Lygis ${front}</small></button>
    <div class="hchips">${STREAK>0?`<span>🔥 Serija ${STREAK}</span>`:''}<span>🎁 <span class="cb"><i style="width:${CHEST/5*100}%"></i></span> ${CHEST}/5</span></div>
    ${advTile()}<div class="tiles"><button id="hdl" class="${dailyDone()?'':'hot'}"><b>📅</b>Dienos iššūkis<small>${dailyDone()?'✅ Šiandien įveikta':'Laukia prizas 🪙'}</small></button>
      <button id="hlv"><b>🗺️</b>Žemėlapis<small>⭐ ${tot}</small></button>
      <button id="hal"><b>📒</b>Kolekcija<small>${al}/${ALL_GOODS.length+XMAS.items.length}</small></button>
      <button id="hac"><b>🏆</b>Pasiekimai<small>${got}/${ACH.length}</small></button></div>
    <button id="hst">⚙️ Nustatymai</button><div class="ver">Versija ${VERSION}</div></div>`;$('home').classList.add('show');
  $('hpl').onclick=()=>{auInit();if(level!==front||game.special||game.moves>0||game.status!=='play')newGame(front);hideHome()};
  $('hdl').onclick=()=>{auInit();startDaily()};if($('hadv'))$('hadv').onclick=()=>{auInit();openAdvent()};$('hac').onclick=()=>openAch();$('hal').onclick=()=>openAlbum();
  $('hlv').onclick=()=>{auInit();hideHome(true);openMenu()};$('hst').onclick=()=>openSettings()}
function hideHome(noFx){HOME.on=false;$('home').classList.remove('show');if(!noFx&&game)startLevelFx()}
/* ===================== VERSIJA IR ATNAUJINIMAI ===================== */
var UPD={latest:null,reg:null};
const verCmp=(a,b)=>{const x=String(a).split('.').map(Number),y=String(b).split('.').map(Number);for(let i=0;i<Math.max(x.length,y.length);i++){const d=(x[i]||0)-(y[i]||0);if(d)return d}return 0};
const hosted=()=>/^https?:$/.test(location.protocol)&&/github\.io$/.test(location.hostname);
async function checkUpdate(manual){
  const say=(t,c)=>{if(!manual)return;const e=$('cus');if(e){e.innerHTML=t;e.style.color=c||''}else toast(t,'')};
  say('⏳ Tikrinama…');
  if(!hosted())return say('ℹ️ Šioje peržiūroje atnaujinimai netikrinami – tik įdiegtame žaidime.');
  if(!navigator.onLine)return say('📴 Nėra interneto ryšio. Prisijunk ir bandyk dar kartą.','#fca5a5');
  try{const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),8000);const r=await fetch('version.json?t='+Date.now(),{cache:'no-store',signal:ctl.signal});clearTimeout(tm);if(!r.ok)throw 0;const j=await r.json();UPD.latest=j.version;
    if(verCmp(j.version,VERSION)>0){$('updt').textContent='Yra nauja versija '+j.version+(j.notes?' – '+j.notes:'');$('upd').classList.add('show');
      say(`🆕 Yra nauja versija <b>${j.version}</b>${j.notes?' – '+j.notes:''}<br><button class="primary" id="cun" style="margin-top:8px;width:100%">Atnaujinti dabar</button>`,'#86efac');const b=$('cun');if(b)b.onclick=applyUpdate}
    else say(`✅ Turi naujausią versiją (${VERSION})`,'#86efac');
  }catch(e){say(navigator.onLine?'⚠️ Nepavyko pasiekti serverio. Patikrink internetą ir bandyk dar kartą.':'📴 Nėra interneto ryšio.','#fca5a5')}}
async function applyUpdate(){$('updb').textContent='Atnaujinama…';
  try{if(UPD.reg){await UPD.reg.update()}const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}catch(e){}
  location.reload()}
$('updb').onclick=applyUpdate;$('updx').onclick=()=>$('upd').classList.remove('show');
if(hosted()&&'serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').then(r=>{UPD.reg=r}).catch(()=>{})}
setTimeout(()=>checkUpdate(false),1500);addEventListener('online',()=>checkUpdate(false));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate(false)});
/* ===================== PALEIDIMAS ===================== */
HOME.on=true;newGame(level,false);showHome();setTimeout(achCheck,2500);

</script>
